name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.AS_ACADEMY_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout with Core submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate course content
        run: python3 tools/validate_course.py

      - name: Run tests
        run: gradle test --stacktrace

      - name: Decode signing keystore
        if: ${{ env.HAS_SIGNING_KEY != '' }}
        run: echo "${{ secrets.AS_ACADEMY_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Build signed Release APK
        if: ${{ env.HAS_SIGNING_KEY != '' }}
        env:
          AS_ACADEMY_KEYSTORE_PATH: release.keystore
          AS_ACADEMY_KEYSTORE_PASSWORD: ${{ secrets.AS_ACADEMY_KEYSTORE_PASSWORD }}
          AS_ACADEMY_KEY_ALIAS: ${{ secrets.AS_ACADEMY_KEY_ALIAS }}
          AS_ACADEMY_KEY_PASSWORD: ${{ secrets.AS_ACADEMY_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Build unsigned Release APK
        if: ${{ env.HAS_SIGNING_KEY == '' }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify signed APK
        if: ${{ env.HAS_SIGNING_KEY != '' }}
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Generate SHA-256 checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk | tee SHA256SUMS.txt

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: as-academy-cplusplus-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Upload mapping file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: as-academy-cplusplus-mapping
          path: app/build/outputs/mapping/release/**
          if-no-files-found: ignore

      - name: Remove decoded keystore
        if: always()
        run: rm -f app/release.keystore
