name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with Core submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        if: ${{ secrets.AS_ACADEMY_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.AS_ACADEMY_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Build signed Release APK
        if: ${{ secrets.AS_ACADEMY_KEYSTORE_BASE64 != '' }}
        env:
          AS_ACADEMY_KEYSTORE_PATH: release.keystore
          AS_ACADEMY_KEYSTORE_PASSWORD: ${{ secrets.AS_ACADEMY_KEYSTORE_PASSWORD }}
          AS_ACADEMY_KEY_ALIAS: ${{ secrets.AS_ACADEMY_KEY_ALIAS }}
          AS_ACADEMY_KEY_PASSWORD: ${{ secrets.AS_ACADEMY_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Build unsigned Release APK
        if: ${{ secrets.AS_ACADEMY_KEYSTORE_BASE64 == '' }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: as-academy-cplusplus-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload mapping file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: as-academy-cplusplus-mapping
          path: app/build/outputs/mapping/release/**
          if-no-files-found: ignore
