name: Android App CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with Core submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Build unsigned Release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Unit tests
        run: gradle test --stacktrace
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: as-academy-cplusplus-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload unsigned Release APK
        uses: actions/upload-artifact@v4
        with:
          name: as-academy-cplusplus-release-unsigned
          path: app/build/outputs/apk/release/*.apk
